spring.application.name=wallet_engine
server.port=8080

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.file.name=app.log

logging.level.com.gregomebije=DEBUG

# Disable in production
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.gregomebije.wallet.config.HttpLoggingInterceptor=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_engine
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# For WebClient
spring.webflux.client.max-in-memory-size=1MB

# integrations
services.ledger.base-url=http://localhost:8081
services.gateway.base-url=http://localhost:8082
services.ledger.token=adfafewa24efwd
services.ledger.email=wallet_tenant@mangital.com
services.ledger.password=password
services.ledger.tenant-id=wallet_tenant
services.ledger.token-ttl-minutes=50

outbox.poll-interval-ms=300000

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka Connection
spring.kafka.bootstrap-servers=localhost:9092