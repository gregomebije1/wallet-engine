spring.application.name=wallet_engine
server.port=8080

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.file.name=app.log

logging.level.com.gregomebije=DEBUG

# Disable in production
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.gregomebije.wallet.config.HttpLoggingInterceptor=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_engine
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# For WebClient
spring.webflux.client.max-in-memory-size=1MB

# integrations
services.ledger.base-url=http://localhost:8081
services.gateway.base-url=http://localhost:8082
services.gateway.charges.url=/gateway/v1/charges

services.ledger.token=adfafewa24efwd
services.ledger.email=wallet_tenant@mangital.com
services.ledger.password=password
services.ledger.tenant-id=wallet_tenant
services.ledger.token-ttl-minutes=50

outbox.poll-interval-ms=300000

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka Connection
spring.kafka.bootstrap-servers=localhost:9092

#----------
# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS (Never use '*' when allowCredentials=true)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}

# JWT & Refresh Token Delivery
# Default secret is 64-byte Base64-encoded (>= 256 bits required). MUST override in production!
app.jwt.secret=${APP_JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtYmFzZTY0LWVuY29kZWQtc2VjcmV0LWtleS1mb3ItZGV2}
app.jwt.access-expiration-ms=${APP_JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.refresh-delivery=${APP_JWT_REFRESH_DELIVERY:cookie}
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${APP_JWT_COOKIE_SAME_SITE:Strict}
app.jwt.cookie-domain=${APP_JWT_COOKIE_DOMAIN:}

# Initial Admin Seed
app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}

# OpenAPI / Public URL
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html

